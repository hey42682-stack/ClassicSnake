<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snake Classic Mobile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100vw;
            max-width: 400px;
            height: 100vh;
            max-height: 700px;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0,255,0,0.2);
        }

        /* Screens Styling */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            gap: 20px;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            color: #4CAF50;
            font-size: 2.5rem;
            text-shadow: 0 0 10px #4CAF50;
        }

        h2 {
            color: #fff;
            font-size: 1.8rem;
        }

        p {
            font-size: 1.2rem;
            color: #ccc;
        }

        /* Buttons */
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
            background-color: #45a049;
        }

        /* Top Header */
        header {
            width: 100%;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #111;
            z-index: 1;
        }

        .score-board {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .pause-btn {
            background: #333;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Canvas Game Board */
        #game-board {
            background-color: #111;
            border: 2px solid #222;
        }

        /* Mobile Controls */
        .controls {
            width: 100%;
            height: 180px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 10px;
            gap: 5px;
            z-index: 1;
            background-color: #0a0a0a;
        }

        .ctrl-btn {
            background-color: #222;
            border: 1px solid #333;
            color: #fff;
            font-size: 1.5rem;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ctrl-btn:active {
            background-color: #4CAF50;
        }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }

    </style>
</head>
<body>

    <div id="game-container">
        
        <!-- Header -->
        <header>
            <div class="score-board">Score: <span id="score">0</span></div>
            <button class="pause-btn" id="pause-btn">⏸ Pause</button>
            <div class="score-board">Best: <span id="high-score">0</span></div>
        </header>

        <!-- Game Canvas -->
        <canvas id="game-board" width="320" height="320"></canvas>

        <!-- Mobile Touch Controls -->
        <div class="controls">
            <button class="ctrl-btn" id="btn-up">▲</button>
            <button class="ctrl-btn" id="btn-left">◀</button>
            <button class="ctrl-btn" id="btn-right">▶</button>
            <button class="ctrl-btn" id="btn-down">▼</button>
        </div>

        <!-- 1. START SCREEN -->
        <div id="start-screen" class="screen">
            <h1>SNAKE GAME</h1>
            <p>Classic Retro Game</p>
            <button class="btn" id="start-btn">PLAY NOW</button>
        </div>

        <!-- 2. PAUSE SCREEN -->
        <div id="pause-screen" class="screen hidden">
            <h2>GAME PAUSED</h2>
            <button class="btn" id="resume-btn">RESUME</button>
        </div>

        <!-- 3. GAME OVER SCREEN -->
        <div id="game-over-screen" class="screen hidden">
            <h1 style="color: #ff4d4d;">GAME OVER</h1>
            <p>Your Score: <span id="final-score">0</span></p>
            <p>Best Score: <span id="best-score">0</span></p>
            <button class="btn" id="restart-btn">PLAY AGAIN</button>
        </div>

    </div>

    <script>
        // Game Logic Setup
        const canvas = document.getElementById("game-board");
        const ctx = canvas.getContext("2d");

        const gridSize = 16;
        const tileCount = canvas.width / gridSize;

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = gridSize;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem("snake_high_score") || 0;
        let gameInterval = null;
        let isPaused = false;

        // UI Elements
        const startScreen = document.getElementById("start-screen");
        const pauseScreen = document.getElementById("pause-screen");
        const gameOverScreen = document.getElementById("game-over-screen");
        
        const scoreEl = document.getElementById("score");
        const highScoreEl = document.getElementById("high-score");
        const finalScoreEl = document.getElementById("final-score");
        const bestScoreEl = document.getElementById("best-score");

        highScoreEl.innerText = highScore;

        // Buttons
        document.getElementById("start-btn").addEventListener("click", startGame);
        document.getElementById("restart-btn").addEventListener("click", startGame);
        document.getElementById("pause-btn").addEventListener("click", togglePause);
        document.getElementById("resume-btn").addEventListener("click", togglePause);

        // Touch Controls
        document.getElementById("btn-up").addEventListener("click", () => changeDirection(0, -gridSize));
        document.getElementById("btn-down").addEventListener("click", () => changeDirection(0, gridSize));
        document.getElementById("btn-left").addEventListener("click", () => changeDirection(-gridSize, 0));
        document.getElementById("btn-right").addEventListener("click", () => changeDirection(gridSize, 0));

        // Keyboard Controls for PC testing
        document.addEventListener("keydown", handleKeyPress);

        function startGame() {
            snake = [
                { x: 5 * gridSize, y: 10 * gridSize },
                { x: 4 * gridSize, y: 10 * gridSize },
                { x: 3 * gridSize, y: 10 * gridSize }
            ];
            dx = gridSize;
            dy = 0;
            score = 0;
            scoreEl.innerText = score;
            
            spawnFood();

            // Hide Screens
            startScreen.classList.add("hidden");
            pauseScreen.classList.add("hidden");
            gameOverScreen.classList.add("hidden");

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 120);
        }

        function gameLoop() {
            moveSnake();
            if (checkGameOver()) {
                endGame();
                return;
            }
            draw();
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // Check if ate food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = score;
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function draw() {
            // Clear Canvas
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Food
            ctx.fillStyle = "#ff4d4d";
            ctx.fillRect(food.x, food.y, gridSize - 1, gridSize - 1);

            // Draw Snake
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#4CAF50" : "#81C784";
                ctx.fillRect(part.x, part.y, gridSize - 1, gridSize - 1);
            });
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * tileCount) * gridSize;
            food.y = Math.floor(Math.random() * tileCount) * gridSize;
        }

        function changeDirection(newDx, newDy) {
            // Prevent 180 degree turns
            if (newDx === -dx && newDy === -dy) return;
            if (isPaused) return;
            dx = newDx;
            dy = newDy;
        }

        function handleKeyPress(e) {
            if (e.key === "ArrowUp" || e.key === "w") changeDirection(0, -gridSize);
            if (e.key === "ArrowDown" || e.key === "s") changeDirection(0, gridSize);
            if (e.key === "ArrowLeft" || e.key === "a") changeDirection(-gridSize, 0);
            if (e.key === "ArrowRight" || e.key === "d") changeDirection(gridSize, 0);
        }

        function togglePause() {
            if (startScreen.classList.contains("hidden") && gameOverScreen.classList.contains("hidden")) {
                isPaused = !isPaused;
                if (isPaused) {
                    clearInterval(gameInterval);
                    pauseScreen.classList.remove("hidden");
                } else {
                    pauseScreen.classList.add("hidden");
                    gameInterval = setInterval(gameLoop, 120);
                }
            }
        }

        function checkGameOver() {
            const head = snake[0];

            // Wall Collision
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                return true;
            }

            // Self Collision
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }

            return false;
        }

        function endGame() {
            clearInterval(gameInterval);
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem("snake_high_score", highScore);
                highScoreEl.innerText = highScore;
            }

            finalScoreEl.innerText = score;
            bestScoreEl.innerText = highScore;

            gameOverScreen.classList.remove("hidden");
        }
    </script>
</body>
</html>
